[project]
name = "bandcamp-sync"
version = "0.1.0"
description = "Sync your purchased Bandcamp downloads into a local folder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.scripts]
bandcamp-sync = "bandcamp_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandcamp_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
